<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер з математики</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: #1e40af;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .task-card {
            background: #fafafa;
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .task-num {
            font-weight: bold;
            color: var(--primary);
            font-size: 18px;
            margin-bottom: 12px;
        }

        .task-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .grid-inputs-t2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .sub-item {
            display: flex;
            align-items: center;
            white-space: nowrap;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .sub-item label {
            font-size: 15px;
            font-weight: 600;
            margin-right: 6px;
            white-space: nowrap;
        }

        .input-short {
            width: 65px !important;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
            transition: all 0.2s;
            box-sizing: border-box;
            text-align: center;
        }

        .select-short {
            width: 85px !important;
            padding: 6px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            transition: all 0.2s;
            box-sizing: border-box;
            margin-right: 8px;
        }

        input[type="text"].correct, select.correct {
            border-color: var(--correct);
            background-color: #f0fdf4;
            color: var(--correct);
            font-weight: bold;
        }

        input[type="text"].incorrect, select.incorrect {
            border-color: var(--incorrect);
            background-color: #fef2f2;
            color: var(--incorrect);
        }

        .check-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .check-btn:hover {
            background-color: var(--primary-hover);
        }

        .task-status {
            display: inline-block;
            margin-left: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        .status-correct {
            color: var(--correct);
        }

        .status-incorrect {
            color: var(--incorrect);
        }

        .sep-label {
            margin: 0 4px 0 8px;
            font-size: 14px;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Тренажер з обчислень</h1>

    <!-- Завдання 1 -->
    <div class="task-card" id="task-1">
        <div class="task-num">№ 1. Обчисли:</div>
        <div class="grid-inputs">
            <div class="sub-item"><label>1) 4 · 0,6 =</label> <input type="text" id="t1-1" class="input-short"></div>
            <div class="sub-item"><label>2) 8 · 0,5 =</label> <input type="text" id="t1-2" class="input-short"></div>
            <div class="sub-item"><label>3) 3 · 0,02 =</label> <input type="text" id="t1-3" class="input-short"></div>
            <div class="sub-item"><label>4) 9 · 0,04 =</label> <input type="text" id="t1-4" class="input-short"></div>
            <div class="sub-item"><label>5) 2 · 3,7 =</label> <input type="text" id="t1-5" class="input-short"></div>
            <div class="sub-item"><label>6) 7 · 1,1 =</label> <input type="text" id="t1-6" class="input-short"></div>
            <div class="sub-item"><label>7) 0,2 · 0,03 =</label> <input type="text" id="t1-7" class="input-short"></div>
            <div class="sub-item"><label>8) 0,9 · 0,08 =</label> <input type="text" id="t1-8" class="input-short"></div>
        </div>
        <button class="check-btn" onclick="checkTask1()">Перевірити № 1</button>
        <span class="task-status" id="status-1"></span>
    </div>

    <!-- Завдання 2 -->
    <div class="task-card" id="task-2">
        <div class="task-num">№ 2. Ділення десяткових дробів</div>
        <div class="task-text">Оберіть, чи потрібно переносити кому (для отримання ділення на ціле число), та обчисліть результат:</div>
        
        <div class="grid-inputs-t2">
            <!-- Аналог 1,2 : 3 -->
            <div class="sub-item">
                <label>1) 2,4 : 4 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-1-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-1-q2" class="input-short">
            </div>

            <!-- Аналог 4,8 : 0,24 -->
            <div class="sub-item">
                <label>2) 3,6 : 0,12 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-2-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-2-q2" class="input-short">
            </div>

            <!-- Аналог 56,8 : 8 -->
            <div class="sub-item">
                <label>3) 42,7 : 7 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-3-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-3-q2" class="input-short">
            </div>

            <!-- Аналог 16,4 : 100 -->
            <div class="sub-item">
                <label>4) 25,8 : 100 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-4-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-4-q2" class="input-short">
            </div>

            <!-- Додатковий аналог ділення на дріб (ціле на дріб) -->
            <div class="sub-item">
                <label>5) 8 : 0,16 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-5-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-5-q2" class="input-short">
            </div>

            <!-- Додатковий аналог ділення на дріб (дріб на дріб) -->
            <div class="sub-item">
                <label>6) 0,63 : 0,9 =</label>
                <span class="sep-label">Кома:</span>
                <select id="t2-6-q1" class="select-short">
                    <option value="">...</option>
                    <option value="так">Так</option>
                    <option value="ні">Ні</option>
                </select>
                <span class="sep-label">Вдп:</span>
                <input type="text" id="t2-6-q2" class="input-short">
            </div>
        </div>
        <button class="check-btn" onclick="checkTask2()">Перевірити № 2</button>
        <span class="task-status" id="status-2"></span>
    </div>

    <!-- Завдання 3 -->
    <div class="task-card" id="task-3">
        <div class="task-num">№ 3. Дії з цілими раціональними числами</div>
        <div class="task-text">Обчисли значення виразів:</div>
        <div class="grid-inputs">
            <div class="sub-item"><label>1) −8 + 15 =</label> <input type="text" id="t3-1" class="input-short"></div>
            <div class="sub-item"><label>2) −7 − 9 =</label> <input type="text" id="t3-2" class="input-short"></div>
            <div class="sub-item"><label>3) 6 − 14 =</label> <input type="text" id="t3-3" class="input-short"></div>
            <div class="sub-item"><label>4) −12 − (−5) =</label> <input type="text" id="t3-4" class="input-short"></div>
            <div class="sub-item"><label>5) −6 · 7 =</label> <input type="text" id="t3-5" class="input-short"></div>
            <div class="sub-item"><label>6) −9 · (−8) =</label> <input type="text" id="t3-6" class="input-short"></div>
            <div class="sub-item"><label>7) 45 : (−5) =</label> <input type="text" id="t3-7" class="input-short"></div>
            <div class="sub-item"><label>8) −72 : (−9) =</label> <input type="text" id="t3-8" class="input-short"></div>
            <div class="sub-item"><label>9) −15 + (−8) =</label> <input type="text" id="t3-9" class="input-short"></div>
            <div class="sub-item"><label>10) 0 · (−14) =</label> <input type="text" id="t3-10" class="input-short"></div>
            <div class="sub-item"><label>11) −48 : 6 =</label> <input type="text" id="t3-11" class="input-short"></div>
            <div class="sub-item"><label>12) −11 · (−3) =</label> <input type="text" id="t3-12" class="input-short"></div>
        </div>
        <button class="check-btn" onclick="checkTask3()">Перевірити № 3</button>
        <span class="task-status" id="status-3"></span>
    </div>

</div>

<script>
function normalize(str) {
    if (!str) return '';
    return str.toString().trim().toLowerCase().replace(/\s+/g, '').replace(/\./g, ',');
}

function checkTask1() {
    const answers = ['2,4', '4', '0,06', '0,36', '7,4', '7,7', '0,006', '0,072'];
    let allCorrect = true;

    answers.forEach((ans, idx) => {
        const input = document.getElementById(`t1-${idx + 1}`);
        const userVal = normalize(input.value);
        const expected = normalize(ans);

        if (userVal === expected && userVal !== '') {
            input.className = 'input-short correct';
        } else {
            input.className = 'input-short incorrect';
            allCorrect = false;
        }
    });

    const status = document.getElementById('status-1');
    if (allCorrect) {
        status.innerText = "Правильно!";
        status.className = "task-status status-correct";
    } else {
        status.innerText = "Є помилки";
        status.className = "task-status status-incorrect";
    }
}

function checkTask2() {
    const data = [
        { q1: 'ні',  q2: '0,6' },   // 2,4 : 4
        { q1: 'так', q2: '30' },    // 3,6 : 0,12
        { q1: 'ні',  q2: '6,1' },   // 42,7 : 7
        { q1: 'ні',  q2: '0,258' }, // 25,8 : 100
        { q1: 'так', q2: '50' },    // 8 : 0,16
        { q1: 'так', q2: '0,7' }    // 0,63 : 0,9
    ];

    let allCorrect = true;

    data.forEach((item, idx) => {
        const sel = document.getElementById(`t2-${idx + 1}-q1`);
        const inp = document.getElementById(`t2-${idx + 1}-q2`);

        const userSel = normalize(sel.value);
        const userInp = normalize(inp.value);

        if (userSel === normalize(item.q1)) {
            sel.className = 'select-short correct';
        } else {
            sel.className = 'select-short incorrect';
            allCorrect = false;
        }

        if (userInp === normalize(item.q2) && userInp !== '') {
            inp.className = 'input-short correct';
        } else {
            inp.className = 'input-short incorrect';
            allCorrect = false;
        }
    });

    const status = document.getElementById('status-2');
    if (allCorrect) {
        status.innerText = "Правильно!";
        status.className = "task-status status-correct";
    } else {
        status.innerText = "Є помилки";
        status.className = "task-status status-incorrect";
    }
}

function checkTask3() {
    const answers = ['7', '-16', '-8', '-7', '-42', '72', '-9', '8', '-23', '0', '-8', '33'];
    let allCorrect = true;

    answers.forEach((ans, idx) => {
        const input = document.getElementById(`t3-${idx + 1}`);
        const userVal = normalize(input.value);
        const expected = normalize(ans);

        if (userVal === expected && userVal !== '') {
            input.className = 'input-short correct';
        } else {
            input.className = 'input-short incorrect';
            allCorrect = false;
        }
    });

    const status = document.getElementById('status-3');
    if (allCorrect) {
        status.innerText = "Правильно!";
        status.className = "task-status status-correct";
    } else {
        status.innerText = "Є помилки";
        status.className = "task-status status-incorrect";
    }
}
</script>

</body>
</html>
