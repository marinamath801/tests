<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дз Модуль числа і виразу</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        #coin-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .title-h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #4338ca;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .piggy-bank {
            background-color: #fffbeb;
            border: 2px solid #fcd34d;
            border-radius: 1rem;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 180px;
            justify-content: center;
        }

        .piggy-icon {
            font-size: 2rem;
        }

        .coin-animate {
            animation: coinBounce 0.4s ease-in-out;
        }

        @keyframes coinBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.15); }
        }

        .piggy-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #b45309;
            text-transform: uppercase;
        }

        .piggy-balance {
            font-size: 1.25rem;
            font-weight: 900;
            color: #78350f;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .task-card {
            background-color: #f8fafc;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .task-num {
            font-size: 1.25rem;
            font-weight: 800;
            color: #3730a3;
        }

        .task-earned {
            font-size: 0.85rem;
            font-weight: 700;
            background-color: #fef3c7;
            color: #78350f;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid #fde68a;
        }

        .task-text {
            font-weight: 600;
            color: #334155;
            font-size: 1rem;
            line-height: 1.5;
        }

        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            font-size: 0.9em;
            padding: 0 0.2em;
        }
        .frac .num {
            border-bottom: 1px solid currentColor;
            padding: 0 2px;
            line-height: 1.1;
        }
        .frac .den {
            padding: 0 2px;
            line-height: 1.1;
        }

        .item-box {
            background: #ffffff;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        input.input-correct {
            border-color: #10b981 !important;
            background-color: #ecfdf5 !important;
        }

        input.input-wrong {
            border-color: #f43f5e !important;
            background-color: #fff1f2 !important;
        }

        .feedback-box {
            display: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            line-height: 1.4;
            border: 1px solid transparent;
            margin-top: 0.25rem;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-correct {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .feedback-wrong {
            background-color: #fff1f2;
            color: #9f1239;
            border-color: #fecdd3;
        }

        .btn-check {
            background-color: #4f46e5;
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            font-size: 0.95rem;
        }

        .btn-check:hover {
            background-color: #4338ca;
        }

        .footer-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding-top: 0.5rem;
        }

        .task-summary {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .mcq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .mcq-opt {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .mcq-opt:hover {
            background-color: #f1f5f9;
        }

        .drag-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: #ffffff;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 2px dashed #cbd5e1;
            min-height: 60px;
            align-items: center;
        }

        .draggable-item {
            background: #e0e7ff;
            color: #3730a3;
            border: 1px solid #c7d2fe;
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: grab;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: transform 0.1s, background-color 0.2s;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .drop-zone {
            min-width: 120px;
            height: 42px;
            border: 2px dashed #94a3b8;
            border-radius: 0.5rem;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            transition: all 0.2s;
        }

        .drop-zone.drag-over {
            background: #e0e7ff;
            border-color: #6366f1;
        }

        .drop-zone.drop-correct {
            border-color: #10b981;
            background: #ecfdf5;
        }

        .drop-zone.drop-wrong {
            border-color: #f43f5e;
            background: #fff1f2;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 10000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 4px solid #fcd34d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 900;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .modal-text {
            color: #64748b;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .modal-prize {
            font-size: 1.5rem;
            font-weight: 900;
            color: #d97706;
            background: #fffbeb;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            border: 1px solid #fde68a;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <canvas id="coin-canvas"></canvas>

    <div class="container">
        <div class="header">
            <div>
                <h1 class="title-h1">Дз Модуль числа і виразу</h1>
                <p class="subtitle">Перетягуй відповіді або вводь їх у поля та отримуй монети!</p>
            </div>
            
            <div class="piggy-bank">
                <div id="piggy-icon" class="piggy-icon">🪙</div>
                <div>
                    <div class="piggy-label">Скарбничка</div>
                    <div class="piggy-balance"><span id="balance">0</span> грн</div>
                </div>
            </div>
        </div>

        <div id="quiz-container" class="quiz-container"></div>
    </div>

    <div id="final-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div style="font-size: 4rem; margin-bottom: 0.5rem;">🪙🎉</div>
            <h2 class="modal-title">Вітаємо!</h2>
            <p class="modal-text">Ти успішно виконав усі завдання тренажера!</p>
            <div id="final-earned-text" class="modal-prize">
                Ви заробили 0 грн!
            </div>
            <button onclick="closeModal()" class="btn-check" style="width: 100%;">
                Чудово!
            </button>
        </div>
    </div>

    <script>
        let totalCoins = 0;
        const solvedItems = new Set();
        let draggedElement = null;

        const tasksData = [
            {
                numberTitle: "№1",
                text: "Знайдіть значення виразу:",
                items: [
                    {
                        id: "t1_1",
                        subText: '1) <span class="frac"><span class="num">-1</span><span class="den">6</span></span> + |-<span class="frac"><span class="num">1</span><span class="den">3</span></span>|',
                        placeholder: "Запишіть результат (наприклад: a/b)",
                        reward: 1,
                        correct: ["1/6"],
                        hint: "Пам'ятай: модуль від'ємного числа дорівнює йому протилежному додатному числу (|a| = -a, якщо a < 0). Спочатку розкрий модуль, а потім зведи дроби до спільного знаменника."
                    },
                    {
                        id: "t1_2",
                        subText: '2) |-0,8| - |-<span class="frac"><span class="num">1</span><span class="den">4</span></span>|',
                        placeholder: "Запишіть результат (наприклад: 0,5 або a/b)",
                        reward: 1,
                        correct: ["0,55", "0.55", "11/20"],
                        hint: "Правило: Модуль будь-якого числа завжди невід'ємний (|a| ≥ 0). Знайди модулі обох чисел та переведи їх в один зручний вид (десятковий або звичайний дріб) перед відніманням."
                    },
                    {
                        id: "t1_3",
                        subText: '3) |<span class="frac"><span class="num">1</span><span class="den">8</span></span>| · |-16|',
                        placeholder: "Запишіть число",
                        reward: 1,
                        correct: ["2"],
                        hint: "Правило: Для множення спочатку знаходять модулі множників, а потім виконують дію множення."
                    },
                    {
                        id: "t1_4",
                        subText: '4) |<span class="frac"><span class="num">3</span><span class="den">7</span></span>| : |-<span class="frac"><span class="num">9</span><span class="den">14</span></span>|',
                        placeholder: "Запишіть результат (наприклад: a/b)",
                        reward: 1,
                        correct: ["2/3"],
                        hint: "Правило: Щоб поділити звичайні дроби, розкрий модулі, а потім помнож перший дріб на дріб, обернений до другого."
                    }
                ]
            },
            {
                numberTitle: "№2",
                text: "Обчисліть:",
                items: [
                    {
                        id: "t2_1",
                        subText: '1) |-60| : 1,5 - 8',
                        placeholder: "Запишіть число",
                        reward: 1,
                        correct: ["32"],
                        hint: "Правило: Порядок виконання дій. Спочатку обчисли значення під знаком модуля, далі виконуй ділення, а в останню чергу — віднімання."
                    },
                    {
                        id: "t2_2",
                        subText: '2) <span class="frac"><span class="num">1</span><span class="den">5</span></span> · |-4,5| - |-2|',
                        placeholder: "Запишіть число (наприклад: -0,5)",
                        reward: 1,
                        correct: ["-1,1", "-1.1"],
                        hint: "Правило: Дії з раціональними числами. Спочатку звільнися від знаків модуля, виконай множення, а потім віднімання чисел з різними знаками."
                    },
                    {
                        id: "t2_3",
                        subText: '3) -|<span class="frac"><span class="num">1</span><span class="den">4</span></span>| · |-0,32| + |5 - 8|',
                        placeholder: "Запишіть число (наприклад: 0,5)",
                        reward: 1,
                        correct: ["2,92", "2.92"],
                        hint: "Правило: Зверни увагу на знак «мінус» перед першим модулем — він залишається після розкриття модуля! Також спочатку обчисли значення виразу всередині третього модуля."
                    },
                    {
                        id: "t2_4",
                        subText: '4) |-8| : |0,2| - |-35|',
                        placeholder: "Запишіть число",
                        reward: 1,
                        correct: ["5"],
                        hint: "Правило: Знайди значення всіх модулів, за пріоритетом дій виконай ділення, після чого знайди різницю."
                    }
                ]
            },
            {
                numberTitle: "№3",
                text: "Обчисли значення виразу:",
                items: [
                    {
                        id: "t3_1",
                        subText: "|0,5² - 1|",
                        placeholder: "Запишіть число (наприклад: 0,5 або a/b)",
                        reward: 1,
                        correct: ["0,75", "0.75", "3/4"],
                        hint: "Правило: Означення модуля |x|. Спочатку виконай піднесення до степеня та віднімання всередині підмодульного виразу. Якщо отримане число від'ємне, його модуль є протилежним додатноим числом."
                    }
                ]
            },
            {
                numberTitle: "№4",
                text: "Обчисліть значення виразу |2a - 3| - |1 - 2a|, якщо a = -2.",
                items: [
                    {
                        id: "t4_1",
                        subText: "Введіть підсумковий результат:",
                        placeholder: "Запишіть число",
                        reward: 1,
                        correct: ["2"],
                        hint: "Правило: Обчислення значень буквених виразів. Підстав значення змінної a у кожен модуль, обчисли значення всередині дужок модулів, розкрий їх і знайди різницю."
                    }
                ]
            },
            {
                numberTitle: "№5",
                text: "Якщо a < 1, то |a - 1| + |-7| =",
                type: "mcq",
                options: [
                    { letter: "А", text: "a - 8" },
                    { letter: "Б", text: "a + 6" },
                    { letter: "В", text: "-a + 6" },
                    { letter: "Г", text: "-a - 6" },
                    { letter: "Д", text: "-a + 8" }
                ],
                items: [
                    {
                        id: "t5_1",
                        reward: 1,
                        correct: ["Д"],
                        hint: "Правило розкриття модуля зі змінною: Якщо підмодульний вираз (a - 1) від'ємний при a < 1, то модуль розкривається із протилежним знаком: |x| = -x. Розкрий модуль, змінивши знаки доданків, та звели подібні доданки."
                    }
                ]
            },
            {
                numberTitle: "№6",
                text: "Установити відповідність між виразами (1–4) та їх значеннями (А–Д). Перетягни картку з відповіддю у відповідний слот за допомогою мишки/пальця.",
                type: "matching_drag",
                leftItems: [
                    { num: "1", text: "|π - 5| + |π - 2|" },
                    { num: "2", text: "|2 - π| - |-π - 5|" },
                    { num: "3", text: "-|π - 5| - |π - 2|" },
                    { num: "4", text: "|π - 2| + |-π - 5|" }
                ],
                rightItems: [
                    { letter: "А", text: "2π + 3" },
                    { letter: "Б", text: "7" },
                    { letter: "В", text: "3" },
                    { letter: "Г", text: "-3" },
                    { letter: "Д", text: "-7" }
                ],
                items: [
                    {
                        id: "t6_1",
                        subText: "1) |π - 5| + |π - 2|",
                        reward: 1,
                        correct: ["В"],
                        hint: "Правило: Порівняй вираз під модулем із нулем (врахуй, що π ≈ 3,14). Якщо вираз від'ємний, розкривай модуль із протилежними знаками: |a - b| = b - a."
                    },
                    {
                        id: "t6_2",
                        subText: "2) |2 - π| - |-π - 5|",
                        reward: 1,
                        correct: ["Д"],
                        hint: "Правило: Визнач знак кожного підмодульного виразу. Якщо вираз під модулем менший за нуль, зміни знаки його доданків на протилежні перед відніманням."
                    },
                    {
                        id: "t6_3",
                        subText: "3) -|π - 5| - |π - 2|",
                        reward: 1,
                        correct: ["Г"],
                        hint: "Правило: Розкрий кожен модуль залежно від знаку підмодульного виразу, враховуючи знаки «мінус», які стоять перед знаками модуля."
                    },
                    {
                        id: "t6_4",
                        subText: "4) |π - 2| + |-π - 5|",
                        reward: 1,
                        correct: ["А"],
                        hint: "Правило: Оскільки (π - 2) > 0, модуль знімається без зміни знаків. Оскільки (-π - 5) < 0, знак кожного доданка змінюється на протилежний."
                    }
                ]
            }
        ];

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            tasksData.forEach((task, tIndex) => {
                const taskCard = document.createElement('div');
                taskCard.className = "task-card";
                
                let maxTaskReward = task.items.reduce((sum, item) => sum + item.reward, 0);
                let contentHTML = '';

                if (task.type === "mcq") {
                    let optsHTML = task.options.map(opt => `
                        <label class="mcq-opt" onclick="selectMCQ('${task.items[0].id}', '${opt.letter}')">
                            <input type="radio" name="mcq_${task.items[0].id}" value="${opt.letter}" id="opt_${task.items[0].id}_${opt.letter}">
                            <span><strong style="color:#4f46e5;">${opt.letter}.</strong> ${opt.text}</span>
                        </label>
                    `).join('');

                    contentHTML = `
                        <div class="mcq-grid">${optsHTML}</div>
                        <div id="feedback_${task.items[0].id}" class="feedback-box"></div>
                    `;
                } else if (task.type === "matching_drag") {
                    let dragCardsHTML = task.rightItems.map(item => `
                        <div class="draggable-item" draggable="true" data-letter="${item.letter}" id="drag_${item.letter}">
                            <span><strong>${item.letter}:</strong> ${item.text}</span>
                        </div>
                    `).join('');

                    let dragRowsHTML = task.items.map(item => `
                        <div class="item-box" style="flex-direction: row; justify-content: space-between; align-items: center; gap: 1rem;">
                            <span style="font-weight: 600;">${item.subText}</span>
                            <div class="drop-zone" id="drop_${item.id}" data-item-id="${item.id}">
                                <span style="color:#94a3b8; font-size:0.8rem; font-weight:600;">Перетягніть сюди</span>
                            </div>
                        </div>
                        <div id="feedback_${item.id}" class="feedback-box"></div>
                    `).join('');

                    contentHTML = `
                        <div style="font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:0.25rem;">Варіанти відповідей:</div>
                        <div class="drag-pool" id="drag-pool" ondragover="allowDrop(event)" ondrop="dropToPool(event)">
                            ${dragCardsHTML}
                        </div>
                        <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:0.5rem;">
                            ${dragRowsHTML}
                        </div>
                    `;
                } else {
                    let itemsHTML = '';
                    task.items.forEach((item) => {
                        itemsHTML += `
                            <div class="item-box">
                                <p style="font-weight: 600;">${item.subText}</p>
                                <input type="text" id="input_${item.id}" placeholder="${item.placeholder}">
                                <div id="feedback_${item.id}" class="feedback-box"></div>
                            </div>
                        `;
                    });
                    contentHTML = `<div style="display:flex; flex-direction:column; gap:0.75rem;">${itemsHTML}</div>`;
                }

                taskCard.innerHTML = `
                    <div class="task-header">
                        <h2 class="task-num">${task.numberTitle}</h2>
                        <div id="task_earned_${tIndex}" class="task-earned">
                            Зароблено: 0 грн із ${maxTaskReward} грн
                        </div>
                    </div>
                    <p class="task-text">${task.text}</p>
                    ${contentHTML}
                    <div class="footer-action">
                        <button onclick="checkTask(${tIndex})" class="btn-check">
                            Перевірити ${task.numberTitle}
                        </button>
                        <div id="task_summary_${tIndex}" class="task-summary"></div>
                    </div>
                `;
                
                container.appendChild(taskCard);
            });

            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const draggables = document.querySelectorAll('.draggable-item');
            const dropZones = document.querySelectorAll('.drop-zone');

            draggables.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedElement = item;
                    e.dataTransfer.setData('text/plain', item.dataset.letter);
                });

                item.addEventListener('click', () => {
                    const emptyZone = Array.from(document.querySelectorAll('.drop-zone')).find(zone => zone.children.length === 1 && zone.children[0].tagName === 'SPAN');
                    if (emptyZone) {
                        emptyZone.innerHTML = '';
                        emptyZone.appendChild(item);
                    } else if (item.parentElement.classList.contains('drop-zone')) {
                        document.getElementById('drag-pool').appendChild(item);
                    }
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');

                    if (draggedElement) {
                        if (zone.children.length > 0 && zone.children[0].classList.contains('draggable-item')) {
                            document.getElementById('drag-pool').appendChild(zone.children[0]);
                        }
                        zone.innerHTML = '';
                        zone.appendChild(draggedElement);
                    }
                });
            });
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function dropToPool(e) {
            e.preventDefault();
            if (draggedElement && draggedElement.parentElement !== document.getElementById('drag-pool')) {
                document.getElementById('drag-pool').appendChild(draggedElement);
            }
        }

        function selectMCQ(itemId, letter) {
            const radio = document.getElementById(`opt_${itemId}_${letter}`);
            if (radio) radio.checked = true;
        }

        function addMoney(amount) {
            totalCoins += amount;
            const balanceEl = document.getElementById('balance');
            const piggyIcon = document.getElementById('piggy-icon');
            
            balanceEl.textContent = totalCoins;
            piggyIcon.classList.remove('coin-animate');
            void piggyIcon.offsetWidth; 
            piggyIcon.classList.add('coin-animate');
        }

        const canvas = document.getElementById('coin-canvas');
        const ctx = canvas.getContext('2d');
        let coins = [];
        let animationFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Coin {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -20 - Math.random() * 100;
                this.radius = 12 + Math.random() * 6;
                this.speedY = 3 + Math.random() * 4;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.rotationSpeed = 0.05 + Math.random() * 0.08;
                this.scaleY = 1;
                this.angle = Math.random() * Math.PI;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.rotationSpeed;
                this.scaleY = Math.cos(this.angle);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(1, this.scaleY);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f59e0b';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = '#fbbf24';
                ctx.fill();

                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#d97706';
                ctx.stroke();

                ctx.fillStyle = '#92400e';
                ctx.font = `bold ${this.radius * 0.9}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('₴', 0, 1);

                ctx.restore();
            }
        }

        function triggerCoinRain(count = 50) {
            coins = [];
            for (let i = 0; i < count; i++) {
                coins.push(new Coin());
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeCoins = 0;

                coins.forEach(coin => {
                    coin.update();
                    coin.draw();
                    if (coin.y < canvas.height + 30) {
                        activeCoins++;
                    }
                });

                if (activeCoins > 0) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animate();
        }

        function normalizeStr(str) {
            return str.trim().toLowerCase().replace(/[\s]/g, '');
        }

        function checkTask(taskIndex) {
            const task = tasksData[taskIndex];
            let correctCount = 0;

            task.items.forEach((item) => {
                const feedbackEl = document.getElementById(`feedback_${item.id}`);
                let userVal = "";

                if (task.type === "mcq") {
                    const checkedOpt = document.querySelector(`input[name="mcq_${item.id}"]:checked`);
                    if (checkedOpt) userVal = checkedOpt.value;
                } else if (task.type === "matching_drag") {
                    const dropZone = document.getElementById(`drop_${item.id}`);
                    const droppedItem = dropZone.querySelector('.draggable-item');
                    if (droppedItem) userVal = droppedItem.dataset.letter;
                } else {
                    const inputEl = document.getElementById(`input_${item.id}`);
                    if (inputEl) userVal = inputEl.value;
                }

                const normalizedUser = normalizeStr(userVal);
                let isCorrect = item.correct.some(ans => normalizeStr(ans) === normalizedUser);

                feedbackEl.className = "feedback-box show";

                if (isCorrect) {
                    correctCount++;
                    if (!solvedItems.has(item.id)) {
                        solvedItems.add(item.id);
                        addMoney(item.reward);
                    }

                    feedbackEl.classList.add('feedback-correct');
                    feedbackEl.innerHTML = `<strong>✓ Правильно! (+${item.reward} грн)</strong>`;
                } else {
                    feedbackEl.classList.add('feedback-wrong');
                    feedbackEl.innerHTML = `<strong style="display:block; margin-bottom:0.25rem;">✗ Неправильно.</strong> Підказка: ${item.hint}`;
                }

                if (task.type === "matching_drag") {
                    const dropZone = document.getElementById(`drop_${item.id}`);
                    dropZone.classList.remove('drop-correct', 'drop-wrong');
                    if (isCorrect) {
                        dropZone.classList.add('drop-correct');
                    } else if (userVal) {
                        dropZone.classList.add('drop-wrong');
                    }
                } else if (task.type !== "mcq") {
                    const inputEl = document.getElementById(`input_${item.id}`);
                    if (inputEl) {
                        inputEl.classList.remove('input-correct', 'input-wrong');
                        if (isCorrect) {
                            inputEl.classList.add('input-correct');
                        } else {
                            inputEl.classList.add('input-wrong');
                        }
                    }
                }
            });

            let taskEarnedCoins = task.items
                .filter(item => solvedItems.has(item.id))
                .reduce((sum, item) => sum + item.reward, 0);

            let maxTaskReward = task.items.reduce((sum, item) => sum + item.reward, 0);

            const taskEarnedEl = document.getElementById(`task_earned_${taskIndex}`);
            taskEarnedEl.textContent = `Зароблено: ${taskEarnedCoins} грн із ${maxTaskReward} грн`;

            const summaryEl = document.getElementById(`task_summary_${taskIndex}`);
            if (correctCount === task.items.length) {
                summaryEl.style.color = "#059669";
                summaryEl.textContent = `Усі завдання номера розв'язано правильно! 🪙`;
                triggerCoinRain(40);
            } else {
                summaryEl.style.color = "#d97706";
                summaryEl.textContent = `Правильно: ${correctCount} з ${task.items.length}. Переглянь підказки!`;
            }

            const totalItemsCount = tasksData.reduce((acc, curr) => acc + curr.items.length, 0);
            if (solvedItems.size === totalItemsCount) {
                setTimeout(() => {
                    document.getElementById('final-earned-text').textContent = `Ви заробили ${totalCoins} грн!`;
                    document.getElementById('final-modal').classList.remove('hidden');
                    triggerCoinRain(120);
                }, 500);
            }
        }

        function closeModal() {
            document.getElementById('final-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', renderQuiz);
    </script>
</body>
